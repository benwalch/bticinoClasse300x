# BTicino Bridge - Single Complete Configuration
# Version: v0.14.1
# Last updated: 2026-03-26
#
# THIS IS THE ONLY CONFIGURATION FILE IN USE
# The other files in configs/ are only historical examples
# Features v0.14.1: QML→Bridge→MQTT sync (device config, ringtones, volumes, display)

# ==================== BRIDGE ====================
bridge:
  name: "BTicino Bridge Enhanced"
  version: "0.14.1"
  log_level: "debug"  # debug, info, warn, error

# ==================== OPENWEBNET ====================
openwebnet:
  host: "127.0.0.1"
  port: 30006
  timeout: 5000ms
  retry_attempts: 3
  retry_delay: 1000ms

# ==================== SIP ====================
sip:
  enabled: true
  local_host: "127.0.0.1"
  local_port: 5060
  server_host: "127.0.0.1"  # Flexisip local
  server_port: 5060
  transport: "tcp"  # tcp, udp, tls
  # look for the right domain for your device under /home/bticino/cfg/extra/90/flexisip/flexisip.conf
  domain: "1ca7e788-aa23-40a0-9aea-14886523f115.bs.iotleg.com"
  username: "webrtc"          # Per slyoldfox: register as webrtc@domain
  # password: omit it — the bridge derives MD5(username:domain:username) at
  # startup (same convention as the answerer identity). Set sip.password only
  # to override with the md5 hash from your flexisip users.db.txt.
  dev_addr: "20"
  use_ha1: true
  insecure_tls: true
  # sip_target: optional INVITE/BYE target override (defaults to the answerer
  # identity per bticino.DeviceVariant: c100x here, c300x on Classe 300X).

# ==================== MQTT ====================
mqtt:
  enabled: true
  host: "<CHANGE_ME>"
  port: 1883
  username: "<CHANGE_ME>"
  password: "<CHANGE_ME>"
  client_id: "bticino_bridge"
  topic_prefix: "bticino"
  # Restart buttons in HA (Configuration section): restart the bridge and
  # reboot the device. DISABLED by default (reboot restarts the whole
  # video intercom). Set to true to expose them.
  enable_system_buttons: false

# ==================== WEB DASHBOARD ====================
web:
  enabled: true
  port: 8082
  static_dir: "web/static"
  templates_dir: "web/templates"

# ==================== HOMEKIT ====================
homekit:
  enabled: false
  name: "BTicino Bridge"
  manufacturer: "BTicino"
  model: "Classe C100X"
  port: "8081"
  pin: "12345678"
  storage_path: "./homekit_data"

# ==================== HARDWARE ====================
hardware:
  enabled: true
  input_device: "/dev/input/event0"
  gpio_monitoring: true
  i2c_scanning: false
  polling_interval: 100ms

# ==================== LOGGING ====================
logging:
  level: "debug"
  file: "/var/log/bticino_bridge.log"
  max_size: "10MB"
  max_files: 5

# ==================== STREAMING (RTSP/WebRTC) ====================
streaming:
  enabled: true
  rtsp_port: 6554
  webrtc_enabled: false
  webrtc_port: 8889
  recording_path: "/home/bticino/cfg/extra/recordings"
  max_duration: 60  # seconds
  auto_stop_on_last_client: true
  # SAFETY: on-demand video activation (RTSP self-INVITE, automatic
  # start on doorbell press, and snapshots). DISABLED by default: enabling
  # video competes with the native firmware and can cause instability/reboot.
  # Set to true ONLY once the video pipeline is validated on your unit.
  video_on_demand: false
  # Camera video backend (only applies if video_on_demand: true):
  #   avmedia   -> *7*300 command: bt_av_media duplicates its RTP towards us
  #                (cooperative with the native firmware; doesn't fight over /dev/video0)
  #   gstreamer -> direct GStreamer pipeline with the VPU (competes with native,
  #                may fail with "Internal data stream error" when cold)
  #   auto      -> tries avmedia and falls back to gstreamer if no RTP flows
  video_backend: "avmedia"
  # Live video during an incoming call to OUR unit, via passive
  # mirror (tap of the native video leg on lo:<native-port> towards the
  # relay; 5007 high-res on c300x, 5002 low-res on c100x, selected via
  # bticino.DeviceVariant in the code — rebuild after changing it). Sends
  # no commands to the bus; independent of video_on_demand.
  live_on_call: true

# ==================== NETWORK ====================
network:
  ntp:
    enabled: true
    server: "pool.ntp.org"
    port: 123
  dns:
    servers:
      - "192.168.178.1"
      - "8.8.8.8"
  firewall:
    block_telemetry: true  # Block telemetry to BTicino
    block_cloud: false     # Block Netatmo cloud
    allow_updates: false   # Allow automatic updates

# ==================== EXTERNAL SERVERS ====================
servers:
  cloud:
    enabled: false
    host: "nv2-bncx.netatmo.net"
    port: 25050
    protocol: "tcp"
    description: "Netatmo Cloud"
    required: false
  logging:
    enabled: false
    host: "log.bs.iotleg.com"
    port: 5001
    protocol: "udp"
    description: "BTicino Log Server"
    required: false
  updates:
    enabled: false
    host: "n3tfw.blob.core.windows.net"
    port: 443
    protocol: "https"
    description: "Firmware Updates (Azure)"
    required: false
  sip_official:
    enabled: false
    host: "sipserver.bs.iotleg.com"
    port: 5061
    protocol: "tls"
    description: "BTicino Official SIP Server"
    required: false

# ==================== NOTIFICATIONS ====================
notifications:
  mqtt:
    enabled: true
    topic: "bticino/notifications"
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    from: ""
    to: ""
  pushover:
    enabled: false
    api_key: ""
    user_key: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# ==================== PRIVACY ====================
privacy:
  block_external_telemetry: true
  block_log_server: true
  block_cloud: false
  disable_auto_updates: true
  local_logging: true

# ==================== SECURITY ====================
security:
  # Basic Auth for the WHOLE dashboard and API (includes /api/config, which
  # contains plaintext passwords). Enabled without web_password → the server
  # responds 503 (fail-closed). The browser will ask for login only once.
  web_auth_required: true
  web_username: "<CHANGE_ME>"
  web_password: "<CHANGE_ME>"
  web_https_enabled: false  # Enable HTTPS
  api_rate_limit: 100       # Requests per minute
  config_audit_log: true    # Configuration change log

# ==================== ADDITIONAL LOCKS ====================
additional_locks:
  # - name: "Back Door"
  #   where: 21
  # - name: "Side Door"
  #   where: 22

# ==================== UDP PROXY ====================
udp_proxy:
  enabled: false
  listen_port: 40004
  target_port: 4000
